[package]
name = "zero_copy_pii_proxy"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["tokio", "macros"] }
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.13", features = ["stream", "json"] }
futures = "0.3"
tokio-stream = "0.1"
tokio-util = "0.7"
bytes = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aho-corasick = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"
hyper = "1.11"
# dotenvy for 12-factor local env support
dotenvy = "0.15"
# metrics and prometheus exporter
metrics = "0.17"
metrics-exporter-prometheus = "0.7"
# tower and tower-http for safeguards
tower = { version = "0.4", features = ["limit", "timeout"] }
tower-http = { version = "0.6", features = ["timeout", "cors"] }
mimalloc = "0.1"
async-stream = "0.3"
regex = "1.10"
once_cell = "1.21"
