name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-lint:
    name: Rust Tests & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Run Tests
        run: cargo test --workspace

  docker-build:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Docker Image
        run: docker build -t zero-copy-pii-proxy:test .
      - name: Start k6 test target
        shell: bash
        run: |
          docker network create pii-ci
          docker run -d --name pii-ci-mock --network pii-ci \
            -v "$GITHUB_WORKSPACE/mock_upstream.js:/app/mock_upstream.js:ro" \
            node:20-alpine node /app/mock_upstream.js
          docker run -d --name pii-ci-proxy --network pii-ci -p 3000:3000 \
            -e PROXY_API_KEY=test_key \
            -e UPSTREAM_API_URL=http://pii-ci-mock:8081 \
            zero-copy-pii-proxy:test
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs pii-ci-proxy
          exit 1
      - name: Run k6 load test
        run: |
          docker run --network pii-ci \
            -v ${{ github.workspace }}:/scripts \
            -e TARGET_URL=http://pii-ci-proxy:3000/v1/chat/completions \
            grafana/k6:latest run /scripts/tests/redteam/load_test.js
      - name: Stop k6 test target
        if: always()
        shell: bash
        run: |
          docker logs pii-ci-proxy || true
          docker rm -f pii-ci-proxy pii-ci-mock || true
          docker network rm pii-ci || true
      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'zero-copy-pii-proxy:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
      - name: Generate Docker Image SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'zero-copy-pii-proxy:test'
          format: 'cyclonedx'
          output: 'sbom.json'
      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-artifacts
          path: |
            trivy-results.sarif
            sbom.json
          if-no-files-found: warn

