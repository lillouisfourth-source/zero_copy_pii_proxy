name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-lint:
    name: Rust Tests & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Run Tests
        run: cargo test --workspace

  docker-build:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Build Docker Image
        run: docker build -t zero-copy-pii-proxy:test .
      - name: Install Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - name: Validate Helm chart
        run: helm lint charts/zero-copy-pii-proxy
      - name: Start k6 test target
        shell: bash
        run: |
          docker network create pii-ci
          docker run -d --name pii-ci-mock --network pii-ci \
            -v "$GITHUB_WORKSPACE/mock_upstream.js:/app/mock_upstream.js:ro" \
            node:20-alpine@sha256:fb4cd12c85ee03686f6af5362a0b0d56d50c58a04632e6c0fb8363f609372293 node /app/mock_upstream.js
          docker run -d --name pii-ci-proxy --network pii-ci -p 3000:3000 \
            -e PROXY_API_KEY=test_key \
            -e UPSTREAM_API_URL=http://pii-ci-mock:8081 \
            zero-copy-pii-proxy:test
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs pii-ci-proxy
          exit 1
      - name: Run k6 load test
        run: |
          docker run --network pii-ci \
            -v ${{ github.workspace }}:/scripts \
            -e TARGET_URL=http://pii-ci-proxy:3000/v1/chat/completions \
            grafana/k6:0.49.0@sha256:8cd78f9d0de5f50bc8821cceecf356d5d9e839e6611c226a3fcf13c591080fbd run /scripts/tests/redteam/load_test.js
      - name: Stop k6 test target
        if: always()
        shell: bash
        run: |
          docker logs pii-ci-proxy || true
          docker rm -f pii-ci-proxy pii-ci-mock || true
          docker network rm pii-ci || true
      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: 'zero-copy-pii-proxy:test'
          version: 'v0.74.0'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
      - name: Generate Docker Image SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: 'zero-copy-pii-proxy:test'
          version: 'v0.74.0'
          format: 'cyclonedx'
          output: 'sbom.json'
      - name: Upload security artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-artifacts
          path: |
            trivy-results.sarif
            sbom.json
          if-no-files-found: warn

