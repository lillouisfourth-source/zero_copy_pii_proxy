replicaCount: 1

image:
  repository: yourregistry/zero_copy_pii_proxy
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

terminationGracePeriodSeconds: 120

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 1000m
    memory: 512Mi

probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5

config:
  proxyPort: 3000
  upstreamApiUrl: https://api.openai.com/v1/chat/completions
  allowedOrigins: https://app.example.com
  piiPatterns: "password,secret,ssn"
  piiConfigMap: ""
  shutdownTimeoutSec: 110

networkPolicy:
  enabled: true
  coreDnsCidr: "10.96.0.10/32"
  kmsVpcEndpointCidr: "10.0.0.0/16"
  upstreamApiCidr: "0.0.0.0/0"
  upstreamApiPort: 443
  mockEgressEnabled: false
  mockEgressPort: 8081

secrets:
  authTokens: "replace-me"
  mockProxyPrivateKey: ""
  mockKmsCiphertext: ""
