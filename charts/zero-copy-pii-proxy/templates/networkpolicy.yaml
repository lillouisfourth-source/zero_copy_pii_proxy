{{- if .Values.networkPolicy.enabled }}
{{- $kmsVpcEndpointCidr := required "A valid networkPolicy.kmsVpcEndpointCidr is required for AWS KMS PrivateLink egress." .Values.networkPolicy.kmsVpcEndpointCidr }}
{{- $upstreamApiCidr := required "A valid networkPolicy.upstreamApiCidr is required for upstream API egress." .Values.networkPolicy.upstreamApiCidr }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zero-copy-pii-proxy.fullname" . }}
  labels:
    {{- include "zero-copy-pii-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "zero-copy-pii-proxy.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.config.proxyPort }}
    - from:
        - namespaceSelector:
            matchLabels:
              monitoring: "true"
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: {{ $kmsVpcEndpointCidr | quote }}
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: {{ $upstreamApiCidr | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.upstreamApiPort | default 443 }}
    {{- if .Values.networkPolicy.mockEgressEnabled }}
    - to:
        - podSelector:
            matchLabels:
              app: pii-mock
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.mockEgressPort | default 8081 }}
    {{- end }}
{{- end }}