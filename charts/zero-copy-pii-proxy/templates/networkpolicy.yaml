{{- if .Values.networkPolicy.enabled }}
{{- $coreDnsCidr := required "A valid networkPolicy.coreDnsCidr is required for CoreDNS egress." .Values.networkPolicy.coreDnsCidr }}
{{- $kmsVpcEndpointCidr := required "A valid networkPolicy.kmsVpcEndpointCidr is required for AWS KMS PrivateLink egress." .Values.networkPolicy.kmsVpcEndpointCidr }}
{{- $upstreamApiCidr := required "A valid networkPolicy.upstreamApiCidr is required for upstream API egress." .Values.networkPolicy.upstreamApiCidr }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "zero-copy-pii-proxy.fullname" . }}
  labels:
    {{- include "zero-copy-pii-proxy.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "zero-copy-pii-proxy.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.config.proxyPort }}
    - from:
        - namespaceSelector:
            matchLabels:
              monitoring: "true"
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
    - to:
        - ipBlock:
            cidr: {{ $coreDnsCidr | quote }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: {{ $kmsVpcEndpointCidr | quote }}
      ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: {{ $upstreamApiCidr | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.upstreamApiPort | default 443 }}
{{- end }}