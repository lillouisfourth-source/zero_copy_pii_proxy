apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zero-copy-pii-proxy.fullname" . }}-secrets
  labels:
    {{- include "zero-copy-pii-proxy.labels" . | nindent 4 }}
type: Opaque
stringData:
  AUTH_TOKENS: {{ required "At least one auth token is required!" .Values.secrets.authTokens | quote }}
  ADMIN_BEARER_TOKEN: {{ required "A dedicated admin bearer token is required!" .Values.secrets.adminBearerToken | quote }}
  {{- if .Values.secrets.mockKmsCiphertext }}
  MOCK_KMS_CIPHERTEXT: {{ .Values.secrets.mockKmsCiphertext | quote }}
  {{- end }}
