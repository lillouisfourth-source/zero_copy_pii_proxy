version: '3.8'
services:
  mock-upstream:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./mock_upstream.js:/app/mock_upstream.js
    command: node mock_upstream.js
    ports:
      - "8081:8081"

  proxy:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=info
      - PROXY_API_KEY=test_key
      - UPSTREAM_API_URL=http://mock-upstream:8081
    depends_on:
      - mock-upstream

  prometheus:
    image: prom/prometheus:v2.45.0
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - proxy

  grafana:
    image: grafana/grafana:10.0.0
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana-provisioning/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
